<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 霧岸營火：旅程起點原型（企畫書 §48、docs/CAMPFIRE_START_HANDOFF.md）。Claude 設計原型，2026-09-28 v2。 -->
<title>霧岸營火</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
  /* Single committed look: the lobby's glass-over-scene language (lobbyA.css tokens). */
  :root {
    color-scheme: dark;
    --ground: #1c2630;
    --ink: #f1eee6;
    --ink-soft: rgba(240, 237, 228, 0.84);
    --ink-faint: rgba(230, 228, 220, 0.66);
    --amber: #e0b265;
    --amber-text: #f0cf8e;
    --teal-text: #bfe0da;
    --glass: rgba(20, 27, 33, 0.44);
    --glass-strong: rgba(20, 27, 33, 0.72);
    --line: rgba(255, 255, 255, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 0 14px rgba(0, 0, 0, 0.28);
    --panel-w: clamp(284px, 30vw, 360px);
    --sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .app { position: fixed; inset: 0; }
  .stage { position: absolute; inset: 0; overflow: hidden;
    background: linear-gradient(180deg, #8e9ba5 0%, #aab4b8 26%, #cfc9bb 44%, #e3cfae 52%, #d8d6cc 64%, #c9cfcd 100%); }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); text-shadow: var(--shadow); }
  .label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-faint); margin: 0; }
  .warm { color: var(--amber-text); }
  .soft { margin: 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.6; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #d9c38f; outline-offset: 3px; }

  /* journey header + collection */
  .top-left { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; max-width: calc(100% - var(--panel-w) - 48px); }
  .journey { padding: 10px 14px; display: grid; gap: 6px; min-width: 180px; }
  .journey h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: 0.14em; line-height: 1.25; }
  .dots { display: flex; align-items: center; gap: 0; }
  .dots b { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(240, 237, 228, 0.55); box-sizing: border-box; }
  .dots i { width: 16px; height: 1px; background: rgba(240, 237, 228, 0.28); }
  .dots small { margin-left: 10px; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.06em; }
  .pill { padding: 8px 14px; border-radius: 16px; font-size: 12.5px; letter-spacing: 0.08em; }
  .pill:hover { background: rgba(40, 50, 58, 0.55); }

  /* prototype controls (not part of the game UI) */
  .proto { position: absolute; top: 16px; right: calc(var(--panel-w) + 32px); display: grid; gap: 6px; justify-items: end; max-width: min(560px, calc(100% - var(--panel-w) - 280px)); }
  .proto .label { color: var(--teal-text); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; padding: 5px; border-radius: 16px; }
  .seg button { border: 1px solid transparent; background: none; border-radius: 12px; padding: 4px 10px; font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { border-color: var(--line); background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  .seg .act { color: var(--teal-text); }

  /* route cards under the close-up */
  .routes { position: absolute; left: 16px; bottom: 16px; right: calc(var(--panel-w) + 32px); display: grid; gap: 8px; transition: opacity 0.6s ease; }
  .routes .label span { opacity: 0.8; }
  .route-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .route { flex: 1 1 220px; max-width: 300px; text-align: left; padding: 11px 14px 12px; display: grid; gap: 4px; border-radius: 16px; transition: border-color 0.3s, background-color 0.3s; }
  .route:hover, .route:focus-visible { background: rgba(34, 43, 50, 0.56); }
  .route.is-selected { border-color: rgba(240, 204, 138, 0.7); background: rgba(52, 44, 30, 0.46); }
  .route-top { display: flex; justify-content: space-between; gap: 8px; }
  .route strong { font-family: var(--serif); font-weight: 600; font-size: 16px; letter-spacing: 0.12em; }
  .route .tag { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .route .meta { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.04em; }

  /* right glass panel */
  .panel { position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--panel-w); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.6s ease; }
  .panel-scroll { overflow: auto; padding: 18px 18px 14px; display: grid; gap: 18px; align-content: start; flex: 1; }
  .next { display: grid; gap: 8px; }
  .next h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: 0.12em; text-wrap: balance; }
  .progress { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .lamps { display: inline-flex; gap: 6px; }
  .lamps i { width: 7px; height: 7px; border-radius: 50%; background: rgba(238, 240, 243, 0.26); }
  .current { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
  .current b { font-weight: 500; font-size: 14px; }
  .primary { width: 100%; padding: 11px 14px; border-radius: 16px; border: 1px solid rgba(240, 204, 138, 0.7); background: rgba(224, 178, 101, 0.2); color: var(--amber-text); font-size: 15px; font-weight: 500; letter-spacing: 0.16em; }
  .primary:hover:not(:disabled) { background: rgba(224, 178, 101, 0.3); }
  .primary:disabled { opacity: 0.45; cursor: default; }
  .note { font-size: 11px; color: var(--ink-faint); }
  .list { display: grid; gap: 8px; }
  .list ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .list li { display: flex; gap: 10px; align-items: baseline; padding: 6px 2px; font-size: 13.5px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
  .list li span:first-child { width: 14px; color: var(--ink-faint); font-size: 11px; text-align: center; flex: none; }
  .list li.first span:first-child { color: var(--amber-text); }
  .list li small { margin-left: auto; color: var(--ink-faint); font-size: 11px; flex: none; }
  .panel-foot { border-top: 1px solid var(--line); padding: 12px 18px 14px; display: grid; gap: 6px; }

  /* pins for things placed in the scene */
  .pin { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; transition: opacity 0.8s ease; }
  .pin .tip { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); padding: 4px 10px; border-radius: 12px; font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .pin:hover .tip, .pin:focus-visible .tip { opacity: 1; }
  .pin::before { content: ""; width: 10px; height: 10px; outline: 2px solid rgba(20, 27, 33, 0.45); border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px 2px rgba(224, 178, 101, 0.55); animation: pulse 2.2s ease-in-out infinite; }
  .pin.seen::before { animation: none; background: rgba(240, 237, 228, 0.55); box-shadow: none; }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: 0.7; } }

  /* sheets */
  .sheet-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 12, 16, 0.25); }
  .sheet { width: min(360px, 100%); padding: 18px; display: grid; gap: 12px; background: var(--glass-strong); }
  .sheet h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: 0.1em; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .ghost { padding: 8px 14px; border-radius: 16px; border: 1px solid var(--line); background: none; color: var(--ink-soft); font-size: 13px; }
  .sheet .primary { width: auto; padding: 8px 18px; font-size: 14px; }

  /* mist veil for arrival / departure */
  .veil { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 45% 55%, #eef0ee, #e2e6e5 60%, #d9dedd); }
  .veil-msg { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; padding: 16px; color: #2d3a3a; text-shadow: none; text-align: center; }
  .veil-msg p { margin: 0; font-size: 14px; letter-spacing: 0.08em; }
  .veil-msg .ghost { color: #2d3a3a; border-color: rgba(45, 58, 58, 0.3); }
  .veil-msg[hidden] { display: none; }
  .ui-fade { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { position: static; }
    .stage { position: relative; height: 62vh; min-height: 380px; }
    .top-left { max-width: calc(100% - 32px); }
    .proto { position: static; justify-items: start; max-width: none; padding: 12px 16px 0; }
    .seg { justify-content: flex-start; }
    .routes { position: static; padding: 12px 16px 0; }
    .route { max-width: none; }
    .panel { position: static; width: auto; margin: 12px 16px 16px; }
    .journey h1 { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { .pin::before { animation: none; } .panel, .routes, .pin { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="霧岸營火：霧海上方的小浮島，旅人坐在營火邊，對面有一個空位；左邊一座吊橋、右邊一串浮石通進霧裡"></canvas>
    <div class="top-left" id="topLeft">

        <h1>霧岸營火</h1>
        <div class="dots" aria-label="已走完 0 段，共 5 段"><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><small>第 1 段 / 5 段</small></div>
      </header>
      <button type="button" class="pill glass" id="collectionBtn">收藏室</button>
    </div>
    <div id="pins"></div>
    <div class="routes" id="routes">
      <p class="label">旅程的第一段往哪裡？<span> · 移到卡片上可以看向那條路</span></p>
      <div class="route-row" id="routeRow"></div>
    </div>
    <div class="veil" id="veil"><div class="veil-msg" id="veilMsg" hidden><p id="veilText"></p><button type="button" class="ghost" id="replayBtn">回到營火重看</button></div></div>
    <div class="sheet-wrap" id="sheetWrap" hidden></div>
  </div>

  <aside class="panel glass" id="panel" aria-live="polite">
    <div class="panel-scroll">
      <section class="next">
        <p class="label" id="nextLabel">旅程的第一段</p>
        <h2 id="nextTitle">選一條路</h2>
        <p class="soft" id="nextSoft">在左邊的兩條路中選一條，選了還可以改。</p>
        <div class="current"><span class="label">這次要做</span><b>寫完電磁學第三章筆記</b></div>
        <button type="button" class="primary" id="primaryBtn" disabled>準備出發</button>
        <small class="note" id="primaryNote">先選一條路</small>
      </section>
      <section class="list" aria-label="今天的清單">
        <p class="label">今天的清單 · 完成 0 / 3 <span class="warm">（範例資料）</span></p>
        <ol>
          <li class="first"><span>●</span>寫完電磁學第三章筆記</li>
          <li><span>·</span>整理實驗數據</li>
          <li><span>↻</span>伸展十分鐘<small>例行</small></li>
        </ol>
      </section>
    </div>
    <footer class="panel-foot">
      <p class="label">行囊 0</p>
      <p class="soft">走完一張地圖會帶回一件信物</p>
    </footer>
  </aside>

  <div class="proto" id="proto">
    <p class="label">原型控制 · 對面空位的痕跡階段</p>
    <div class="seg glass" id="stageSeg" role="group" aria-label="痕跡階段"></div>
    <div class="seg glass" role="group" aria-label="演出">
      <button type="button" class="act" id="playReturn">播放「回到營火」</button>
      <button type="button" class="act" id="playDepart">播放「借火出發」</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {

const T = window.THREE;
if (!T) { document.getElementById('nextSoft').textContent = '3D 函式庫載入失敗，請重新整理頁面。'; return; }
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- small helpers ----------
let seed = 7;

const V3 = (x, y, z) => new T.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ---------- sequences ----------
// 借火出發: stand (0–0.8) → step to the fire (0.8–1.3) → kneel and hold the lantern over the flames (1.3–2.45;
// the spark jumps 1.75–2.05, the lantern catches 2.05–2.4) → rise (–2.75) → walk onto the chosen way (2.75–5.0)
// while the mist closes. 5 s total, the App's exit cap.
const DEPART = 5.0;
// crouch weight: kneel in 1.3–1.6 s, hold the lantern over the fire until 2.45 s, rise by 2.75 s
const crouchW = (t) => ease((t - 1.3) / 0.3) * (1 - ease((t - 2.45) / 0.3));
let crouchSpot = null, walkPath = null;
function depart() {
  if (S.mode === 'depart') return; closeSheet();
  S.mode = 'depart'; S.t = 0; S.hover = null;
  ['panel', 'routes', 'topLeft', 'proto', 'pins'].forEach((id) => $(id).classList.add('ui-fade'));
  const dir = [FIRE[0] - HERO_SEAT.x, FIRE[1] - HERO_SEAT.z]; const l = Math.hypot(dir[0], dir[1]);
  crouchSpot = V3(FIRE[0] - dir[0] / l * 0.95, 0, FIRE[1] - dir[1] / l * 0.95); crouchSpot.y = topH(crouchSpot.x, crouchSpot.z);
  const W = WAYS[S.selected];
  // Keep the full body/hat outside the seated log, pack and signpost, rather than
  // cutting diagonally through the seat on the way to the left bridge.
  const approach = S.selected === 'bridge'
    ? [at(0.75, -1.3), at(0.85, -2.8), at(-0.5, -3.8), at(-2.1, -4.0)]
    : [at(W.from[0] * 0.55, W.from[1] * 0.55)];
  const pts = [crouchSpot.clone(), ...approach, at(W.from[0], W.from[1])]; for (let i = 1; i <= 3; i++) pts.push(W.pt(i * 0.05));
  walkPath = new T.CatmullRomCurve3(pts, false, 'centripetal');
  camTo({ tx: -0.25, ty: 0.55, tz: -0.9, w: 6.2 }, 1.6); S.panned = false;
}
const departPan = () => { const L = lookView(S.selected); camTo({ w: 16, ty: 0.2, tx: lerp(CLOSE.tx, L.tx, 0.45), tz: lerp(CLOSE.tz, L.tz, 0.45) }, 2.6); };
function playReturn() {
  resetHero(false); S.mode = 'return'; S.t = 0; const seen = Object.assign({}, S.seenFind); delete seen[Math.min(S.stage, 4)]; S.seenFind = seen; renderPins();
}

  $('veilMsg').hidden = true; $('veil').style.opacity = 0; camTo(CLOSE, fromVeil ? 0.01 : 1.2); if (fromVeil) { cam.cur = Object.assign({}, CLOSE); cam.t = 1; }
}

// spark from fire to lantern
const SPARK = new T.Sprite(new T.SpriteMaterial({ map: haloTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0, fog: false })); SPARK.scale.set(0.35, 0.35, 1); root.add(SPARK);
let fireBoost = 0;

// ---------- update ----------
const clock = new T.Clock(); let time = 0;
const tmpQ = new T.Quaternion(), tmpV = new T.Vector3();
function staffInHand(tilt, pickup = 1) {
  // Keep the same left hand from pickup through lighting and walking.
  hero.g.updateMatrixWorld(true); const hand = hero.arms[STAFF_ARM].hand.getWorldPosition(V3());
  const handLocal = root.worldToLocal(hand.clone());
  const q = new T.Quaternion().setFromEuler(new T.Euler(0.15 + tilt * 0.95, hero.g.rotation.y, 0, 'YXZ'));
  q.copy(leanStaff.q.clone().slerp(q, pickup));

function update(dt) {

  if (!dragging) { yawOff *= Math.pow(0.02, dt); pitchOff *= Math.pow(0.02, dt); }
  placeCamera();

  // fire
  const fl = 0.85 + 0.1 * Math.sin(mt * 9.1) + 0.06 * Math.sin(mt * 23.7) + 0.05 * Math.sin(mt * 4.3) + fireBoost * 0.35;
  FIREFX.light.intensity = 1.5 * fl; FIREFX.halo.material.opacity = 0.42 + 0.12 * fl; FIREFX.glow.material.opacity = 0.28 + 0.1 * fl;
  FIREFX.flames.forEach((f, i) => { const k = 0.85 + 0.2 * Math.sin(mt * (7 + i * 1.3) + f.ph) + 0.08 * Math.sin(mt * 17 + i) + fireBoost * 0.3; f.sp.scale.set(f.h * 0.55 * (0.9 + 0.1 * Math.sin(mt * 5 + i)), f.h * k, 1); f.sp.material.rotation = 0.08 * Math.sin(mt * 3 + i) + 0.05 * wind(mt, 0, 0); });
  { const E = FIREFX.embers; E.base.forEach((b, i) => { b.t += dt * b.sp * 0.5 * (reduceMotion ? 0.3 : 1); if (b.t > 1) { b.t -= 1; b.x = rr(-0.2, 0.2); b.z = rr(-0.2, 0.2); } const y = 0.2 + b.t * 1.9; E.pos[i * 3] = b.x + Math.sin(mt * 2 + i) * 0.08 * b.t + b.t * 0.35 * (0.5 + 0.5 * wind(mt, 0, 0)); E.pos[i * 3 + 1] = y; E.pos[i * 3 + 2] = b.z + b.dr * b.t * 0.4; }); E.geo.attributes.position.needsUpdate = true; }

  FERNS.forEach((f) => { f.g.rotation.z = 0.05 * Math.sin(mt * 1.4 + f.ph); });

  { const a = SIGN.cloth.geometry.attributes.position; const b = SIGN.base; for (let i = 0; i < a.count; i++) { const y = b[i * 3 + 1]; const d = -y / 0.62; a.array[i * 3 + 2] = b[i * 3 + 2] + d * d * (0.22 + 0.08 * Math.sin(mt * 6 - y * 12)) ; a.array[i * 3] = b[i * 3] + d * 0.05 * Math.sin(mt * 5 - y * 9); } a.needsUpdate = true; SIGN.cloth.rotation.y = 0.8 + 0.3 * wind(mt, 0, -3); }

  const veilTarget = (way) => (S.hover === way || (S.mode === 'depart' && S.selected === way && S.t < 2.6)) ? 0.3 : 0.92;

  ['bridge', 'steps'].forEach((k) => { const tgt = veilTarget(k); VEILS[k].forEach((m) => { m.base = lerp(m.base, tgt, 1 - Math.pow(0.15, dt)); m.sp.material.opacity = m.base; });
    const on = S.hover === k ? 1 : S.selected === k ? 0.4 : 0; TRACES[k].forEach((tr, i) => { const want = on * sstep(0, 0.35, (S.hover === k ? S.hoverT || 0 : 1) - i * 0.12); tr.v = lerp(tr.v, want || (S.selected === k ? 0.4 : 0), 1 - Math.pow(0.05, dt)); tr.sp.material.opacity = tr.v * (0.75 + 0.1 * Math.sin(mt * 3 + i)); }); });

  if (TRACE_OBJ[3].visible) { const a = TARP.mesh.geometry.attributes.position; TARP.base.forEach(([x, y, z, u, v], i) => { const f = u * u * (0.05 + 0.025 * wind(mt, x, z)); a.setXYZ(i, x + f * 0.3, y + f * Math.sin(mt * 3 + v * 5), z); }); a.needsUpdate = true; }
  if (S.stage >= 5) { const p = mixPose(POSES.sitOld, Object.assign({}, POSES.sitOld, { headX: 0.05, headY: -0.25 }), 0.5 + 0.5 * Math.sin(mt * 0.2)); applyPose(elder, p); elder.torso.scale.y = 1 + 0.012 * Math.sin(mt * 1.6); }

      pose = t < 0.35 ? mixPose(POSES.read, pickupPose, ease(t / 0.35)) : mixPose(pickupPose, POSES.stand, step);

    } else {
      const k = clamp((t - 2.75) / 2.25, 0, 1); const u = k * k * (3 - 2 * k) * 0.94 + 0.02; const p = walkPath.getPointAt(Math.min(u, 1)); const p2 = walkPath.getPointAt(Math.min(1, u + 0.02));
      hero.g.position.copy(p); const yaw = Math.atan2(p2.x - p.x, p2.z - p.z); hero.g.rotation.y = lerpAngle(hero.g.rotation.y, yaw, 1 - Math.pow(0.001, dt));

    }
    if (t >= DEPART && $('veilMsg').hidden) { const r = ROUTES.find((x) => x.way === S.selected); $('veilText').textContent = '（接到' + r.title + '的入口，開始這一段的專注）'; $('veilMsg').hidden = false; S.mode = 'gone'; }

    else if (S.selected && S.mode === 'idle') { const e = WAYS[S.selected].from; const yaw = clamp(wrap(faceTo([HERO_SEAT.x, HERO_SEAT.z], e) - HERO_YAW), -1.25, 1.25); pose = Object.assign({}, pose, { headY: pose.headY + yaw * 0.25 * glance }); }

  if (S.mode === 'depart' || S.mode === 'gone') {

    const k = S.mode === 'gone' ? 1 : ease((t - 0.35) / 0.45);
    const h = staffInHand(tilt, k);
    if (t < 0.35 && S.mode !== 'gone') { heroStaff.g.position.copy(leanStaff.p); heroStaff.g.quaternion.copy(leanStaff.q); }
    else { heroStaff.g.position.copy(h.p); heroStaff.g.quaternion.copy(h.q); }
  } else { heroStaff.g.position.copy(leanStaff.p); heroStaff.g.quaternion.copy(leanStaff.q); }
  // lanterns hang upright and swing a little
  [heroStaff, oldStaff].forEach((s, i) => { s.g.updateMatrixWorld(true); const wq = s.g.getWorldQuaternion(new T.Quaternion()); const inv = wq.invert(); s.lantern.g.quaternion.copy(inv).multiply(new T.Quaternion().setFromEuler(new T.Euler(0.06 * Math.sin(mt * 1.7 + i), 0, 0.06 * Math.cos(mt * 1.3 + i)))); });

  // pins follow their anchors
  if (S.pin && S.pin.el.isConnected) { const w = root.localToWorld(S.pin.f.anchor()); const p = w.project(camera); const r = canvas.getBoundingClientRect(); S.pin.el.style.left = ((p.x + 1) / 2 * r.width) + 'px'; S.pin.el.style.top = ((1 - p.y) / 2 * r.height) + 'px'; }
}
const wrap = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const lerpAngle = (a, b, t) => a + wrap(b - a) * t;

function frame() { const dt = Math.min(clock.getDelta(), 0.05); if (!window.__hold) { update(dt); renderer.render(scene, camera); } requestAnimationFrame(frame); }
renderStageSeg(); resize(); setStage(0, false); resetHero(true);
// #met0 … #true deep-link to a stage (bare anchors only)
const h = location.hash.replace('#', ''); const si = STAGES.findIndex((s) => s.key === h); if (si >= 0) setStage(si, false);
requestAnimationFrame(frame);
window.__campfire = { setStage, depart, playReturn, S, setHover,
  debugState() {
    root.updateMatrixWorld(true);
    const a = root.worldToLocal(travellerLog.localToWorld(V3(0, -0.85, 0))), b = root.worldToLocal(travellerLog.localToWorld(V3(0, 0.85, 0)));
    return { position: hero.g.position.toArray(), legs: hero.legs.map(l => l.thigh.rotation.x), arms: hero.arms.map(a => a.sh.rotation.x), hipY: hero.hip.position.y,
      staff: { position: heroStaff.g.position.toArray(), grip: root.worldToLocal(heroStaff.g.localToWorld(V3(0, STAFF_GRIP, 0))).toArray(), hand: root.worldToLocal(hero.arms[STAFF_ARM].hand.getWorldPosition(V3())).toArray(), side: 'left' },
      scale: hero.g.scale.x, log: { a: [a.x, a.z], b: [b.x, b.z], radius: 0.22 },
      path: walkPath ? Array.from({length:401}, (_, i) => walkPath.getPointAt(i / 400).toArray()) : [],
      model: { leg: hero.legs[0].thigh.children[0].geometry.parameters, cloak: hero.cloak.geometry.parameters, headY: hero.head.position.y, arms: hero.arms.map(a => a.sh.position.toArray()) } };
  },
  setSelected(way) { S.selected = way; renderRoutes(); renderPanel(); },
  setSeen(stage, seen) { S.seenFind[stage] = seen; renderPins(); },
  advance(sec) { for (let i = 0; i < Math.round(sec * 30); i++) update(1 / 30); renderer.render(scene, camera); } };
})();
