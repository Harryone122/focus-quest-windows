<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 收藏室（旅人行李的內部）與線索桌原型（企畫書 §50、docs/COLLECTION_ROOM_HANDOFF.md）。Claude 設計原型，2026-09-28。 -->
<title>收藏室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=LXGW+WenKai+TC&display=swap">
<style>
  /* Single committed look: the lobby's glass-over-scene language (lobbyA.css tokens). */
  :root {
    color-scheme: dark;
    --ground: #17120e;
    --ink: #f1eee6;
    --ink-soft: rgba(240, 237, 228, 0.84);
    --ink-faint: rgba(230, 228, 220, 0.66);
    --amber: #e0b265;
    --amber-text: #f0cf8e;
    --teal-text: #bfe0da;
    --core-blue: #9cc8e8;
    --glass: rgba(20, 27, 33, 0.44);
    --glass-strong: rgba(20, 27, 33, 0.74);
    --line: rgba(255, 255, 255, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 0 14px rgba(0, 0, 0, 0.28);
    --panel-w: clamp(284px, 30vw, 360px);
    --sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --hand: "LXGW WenKai TC", "Noto Serif TC", "Kaiti TC", serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .app { position: fixed; inset: 0; }
  .stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse 90% 70% at 52% 0%, #4a3b2c 0%, #2a2119 45%, #17120e 100%); }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #scene.pointing { cursor: pointer; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); text-shadow: var(--shadow); }
  .label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-faint); margin: 0; }
  .warm { color: var(--amber-text); }
  .blue { color: var(--core-blue); }
  .soft { margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #d9c38f; outline-offset: 3px; }
  .ghost { padding: 8px 14px; border-radius: 16px; border: 1px solid var(--line); background: none; color: var(--ink-soft); font-size: 13px; }
  .ghost:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
  .ghost:disabled { opacity: 0.35; cursor: default; }
  .primary { padding: 9px 16px; border-radius: 16px; border: 1px solid rgba(240, 204, 138, 0.7); background: rgba(224, 178, 101, 0.2); color: var(--amber-text); font-size: 14px; font-weight: 500; letter-spacing: 0.12em; }
  .primary:hover { background: rgba(224, 178, 101, 0.3); }

  /* header */
  .top-left { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; z-index: 3; max-width: calc(100% - 32px); }
  .head { padding: 10px 14px; display: grid; gap: 4px; min-width: 150px; }
  .head h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: 0.14em; line-height: 1.25; }
  .track { font-size: 12px; color: var(--amber-text); letter-spacing: 0.04em; }
  .pill { padding: 8px 14px; border-radius: 16px; font-size: 12.5px; letter-spacing: 0.08em; }
  .pill:hover { background: rgba(40, 50, 58, 0.55); }
  .hint { position: absolute; right: 16px; bottom: 16px; padding: 7px 14px; font-size: 12px; color: var(--ink-faint); letter-spacing: 0.06em; z-index: 3; white-space: nowrap; transition: opacity 0.4s; }

  /* floating labels in the scene */
  .pin { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 14px; font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; z-index: 2; pointer-events: none; }
  .pin::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px 2px rgba(224, 178, 101, 0.55); animation: pulse 2.2s ease-in-out infinite; }
  .pin.blue::before { background: var(--core-blue); box-shadow: 0 0 10px 2px rgba(140, 190, 230, 0.55); }
  .pin.plain::before { animation: none; background: rgba(240, 237, 228, 0.55); box-shadow: none; }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: 0.7; } }
  .hot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 0; background: none; opacity: 0; z-index: 2; pointer-events: none; }
  .hot:focus-visible { opacity: 1; outline: 2px solid #d9c38f; }

  /* right panel */
  .panel { position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--panel-w); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; z-index: 6; }
  .panel:not([hidden]) { animation: panel-in 260ms cubic-bezier(.2,.8,.2,1) both; }
  .sheet-wrap:not([hidden]), .book-wrap:not([hidden]) { animation: shade-in 220ms ease-out both; }
  .sheet-wrap:not([hidden]) > .sheet, .book-wrap:not([hidden]) > .book { animation: window-in 300ms cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 60%; }
  @keyframes panel-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes shade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes window-in { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .panel-scroll { overflow: auto; padding: 18px; display: grid; gap: 14px; align-content: start; flex: 1; }
  .panel h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: 0.12em; text-wrap: balance; }
  .panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .x { border: 0; background: none; color: var(--ink-faint); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 10px; }
  .x:hover { color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--line); color: var(--ink-soft); width: fit-content; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.blue { color: var(--core-blue); border-color: rgba(156, 200, 232, 0.4); }
  .chip.warm { color: var(--amber-text); border-color: rgba(240, 207, 142, 0.4); }
  .obs { margin: 0; font-family: var(--hand); font-size: 16px; line-height: 1.75; color: var(--ink); }
  .sec { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .clue-row { display: grid; gap: 2px; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .clue-row small { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.04em; }
  .need { display: grid; gap: 3px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
  .need b { font-weight: 500; font-size: 14px; }
  .need small { font-size: 11.5px; line-height: 1.5; color: var(--ink-faint); }
  .need small.blue { color: var(--core-blue); }
  .need .ghost { justify-self: start; margin-top: 4px; padding: 5px 11px; font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .eye { width: 100%; aspect-ratio: 1; max-width: 240px; justify-self: center; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px rgba(176, 141, 87, 0.55), 0 0 0 7px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.8); }
  .eye canvas { width: 100%; height: 100%; display: block; }

  /* table mode */
  .table-ui { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.45s ease; }
  .table-ui.on { opacity: 1; }
  .table-ui.on > * { pointer-events: auto; }
  .tbar { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; align-items: center; padding: 6px 8px 6px 6px; }
  .tbar h2 { margin: 0 6px; font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: 0.14em; }
  .dim { position: absolute; border-radius: 6px; box-shadow: 0 0 0 200vmax rgba(12, 9, 7, 0.5); pointer-events: none !important; }
  .hits { position: absolute; inset: 0; pointer-events: none !important; }
  .hit { position: absolute; border: 0; background: none; border-radius: 50%; pointer-events: auto; transform: translate(-50%, -50%); }
  .hit:hover { background: rgba(224, 178, 101, 0.12); }
  .hit.sq { border-radius: 4px; }
  .hit:focus-visible { outline: 2px solid #8a5a1e; }
  .tray { position: absolute; left: 16px; bottom: 58px; padding: 10px 12px; display: grid; gap: 8px; max-width: calc(100% - var(--panel-w) - 64px); }
  .tray-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .tray-cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .card { flex: 0 0 196px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(80, 60, 30, 0.35); background: #e9dfc6; color: #3b3226; text-shadow: none; display: grid; gap: 3px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .card:hover { background: #f1e8d2; }
  .card small { font-size: 10.5px; letter-spacing: 0.06em; color: #7a6a52; }
  .card span { font-family: var(--hand); font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* sheet (departure mock) */
  .sheet-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 4, 0.35); z-index: 8; }
  .sheet { width: min(380px, 100%); padding: 18px; display: grid; gap: 12px; background: var(--glass-strong); }
  .sheet h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: 0.1em; }
  .pick { display: grid; gap: 6px; }
  .pick button { text-align: left; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: none; font-size: 13.5px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; }
  .pick button[aria-pressed="true"] { border-color: rgba(156, 200, 232, 0.7); background: rgba(120, 170, 210, 0.16); color: var(--ink); }
  .pick button small { color: var(--ink-faint); font-size: 11px; }
  .sheet .row { justify-content: flex-end; }

  /* notebook */
  .book-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 4, 0.55); z-index: 9; }
  .book { width: min(820px, 100%); display: grid; gap: 12px; }
  .spread { display: grid; grid-template-columns: 1fr 1fr; gap: 0; aspect-ratio: 1.55; max-height: 70vh; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.55)); }
  .page { position: relative; background: #e8dcc0; color: #3b3226; padding: clamp(14px, 3.4vw, 34px); font-family: var(--hand); font-size: clamp(13px, 1.9vw, 17px); line-height: 1.9; overflow: hidden; }
  .page:first-child { border-radius: 6px 0 0 6px; box-shadow: inset -18px 0 24px -18px rgba(60, 40, 20, 0.45); }
  .page:last-child { border-radius: 0 6px 6px 0; box-shadow: inset 18px 0 24px -18px rgba(60, 40, 20, 0.45); }
  .page p { margin: 0 0 0.6em; }
  .page .meta { font-family: var(--sans); font-size: 11px; letter-spacing: 0.1em; color: #8a7658; margin-bottom: 10px; }
  .page .ink2 { color: #2f4c6b; }
  .page.found { background: #dccfae; }
  .page.found::before, .page.found::after { content: ""; position: absolute; width: 58px; height: 18px; background: rgba(230, 220, 190, 0.7); top: 10px; transform: rotate(-8deg); }
  .page.found::before { left: 10px; }
  .page.found::after { right: 10px; transform: rotate(7deg); }
  .page.stub { background: transparent; box-shadow: none; }
  .page.stub::before { content: ""; position: absolute; top: 0; bottom: 0; width: 26px; background: #e2d5b8; clip-path: polygon(0 0, 100% 0, 60% 4%, 90% 9%, 55% 14%, 85% 20%, 50% 26%, 80% 32%, 58% 38%, 88% 45%, 52% 52%, 84% 58%, 55% 65%, 90% 72%, 50% 79%, 82% 86%, 56% 93%, 86% 100%, 0 100%); }
  .page.stub:first-child::before { right: 0; transform: scaleX(-1); }
  .page.stub:last-child::before { left: 0; }
  .page .stub-note { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-faint); }
  .page.blank { background: #e8dcc0; }
  .tree { width: 60%; margin: 6px auto 10px; display: block; }
  .book-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* toast + veil */
  .toast { position: absolute; top: 18px; left: 50%; transform: translate(-50%, -8px); padding: 9px 16px; font-size: 13px; letter-spacing: 0.06em; z-index: 11; opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .veil { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #0c0907; z-index: 10; }

  /* prototype controls (not part of the game UI) */
  .proto { position: absolute; left: 16px; bottom: 16px; z-index: 7; max-width: min(460px, calc(100% - var(--panel-w) - 64px)); padding: 8px 10px; border-radius: 16px; font-size: 12px; }
  .proto summary { cursor: pointer; color: var(--teal-text); letter-spacing: 0.1em; font-size: 11px; list-style: none; }
  .proto summary::-webkit-details-marker { display: none; }
  .proto[open] summary { margin-bottom: 8px; }
  .proto .grp { display: grid; gap: 4px; margin-bottom: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { border: 1px solid transparent; background: none; border-radius: 12px; padding: 3px 9px; font-size: 12px; color: var(--ink-faint); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { border-color: var(--line); background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  .seg .act { color: var(--teal-text); }
  .seg .c0 { opacity: 0.55; }
  .seg .c1 { color: var(--core-blue); }
  .seg .c2 { color: var(--core-blue); border-color: rgba(156, 200, 232, 0.5); }
  .ui-fade { opacity: 0 !important; pointer-events: none !important; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { position: static; }
    .stage { position: relative; height: 64vh; min-height: 400px; }
    .panel { position: static; width: auto; margin: 12px 16px 0; }
    .proto { position: static; max-width: none; margin: 12px 16px 16px; }
    .hint { display: none; }
    .tray { max-width: calc(100% - 32px); }
    .card { flex-basis: 170px; }
  }
  @media (prefers-reduced-motion: reduce) { .pin::before, .panel:not([hidden]), .sheet-wrap:not([hidden]), .book-wrap:not([hidden]), .sheet-wrap:not([hidden]) > .sheet, .book-wrap:not([hidden]) > .book { animation: none; } .table-ui, .toast { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="收藏室：旅人行李的內部。帆布內壁上縫著口袋、掛著鐘和架子，中央是一張線索桌，上方是打開的包口。"></canvas>
    <div id="pins"></div>
    <div id="hots"></div>
    <div class="top-left" id="topLeft">
      <header class="head glass">
        <p class="label">行李的內部</p>
        <h1>收藏室</h1>
        <span class="track" id="trackLine" hidden></span>
      </header>
      <button type="button" class="pill glass" id="backBtn">回大廳</button>
    </div>
    <p class="hint glass" id="hint">點展示品看細節 · 點桌子攤開線索 · 拖曳可以偷看</p>

    <div class="table-ui" id="tableUi" aria-hidden="true">
      <div class="dim" id="dim"></div>
      <div class="hits" id="hits"></div>
      <div class="tbar glass">
        <button type="button" class="ghost" id="tableBack">回到行李裡</button>
        <h2>線索桌</h2>
      </div>
      <div class="tray glass" id="tray" hidden>
        <div class="tray-head"><p class="label">新的線索 · <span id="trayCount">0</span></p><div><button type="button" class="ghost" id="pinAll">全部釘上</button><button type="button" class="ghost" id="pinSingle">單獨釘上</button></div></div>
        <div class="tray-cards" id="trayCards"></div>
      </div>
    </div>

    <div class="sheet-wrap" id="sheetWrap" hidden></div>
    <div class="book-wrap" id="bookWrap" hidden></div>
    <div class="veil" id="veil"></div>
    <div class="toast glass" id="toast" role="status"></div>
  </div>

  <aside class="panel glass" id="panel" aria-live="polite" hidden><div class="panel-scroll" id="panelBody"></div></aside>

  <details class="proto glass" id="proto" open>
    <summary>原型控制（不屬於遊戲畫面）</summary>
    <div class="grp"><p class="label">進度</p><div class="seg" id="presetSeg"></div></div>
    <div class="grp"><p class="label">核心（點一下切換：空 → 已放上 → 看懂了）</p><div class="seg" id="coreSeg"></div></div>
    <div class="grp"><p class="label">演出</p><div class="seg">
      <button type="button" class="act" id="actEnter">打開行李：放上新核心</button>
      <button type="button" class="act" id="actLink">十件齊的聯動</button>
    </div></div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const T = window.THREE;
if (!T) { document.getElementById('hint').textContent = '3D 函式庫載入失敗，請重新整理頁面。'; return; }
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- helpers ----------
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const V3 = (x, y, z) => new T.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const mat = (c, e) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.95, metalness: 0, flatShading: true }, e || {}));
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new T.CanvasTexture(c); t.anisotropy = 4; return t; };
const radial = (stops) => canvasTex(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
const haloTex = radial([[0, 'rgba(255,230,180,1)'], [0.3, 'rgba(255,190,110,0.4)'], [1, 'rgba(255,160,80,0)']]);
const dotTex = radial([[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']]);
const mistTex = radial([[0, 'rgba(255,255,255,0.85)'], [0.5, 'rgba(255,255,255,0.35)'], [1, 'rgba(255,255,255,0)']]);

// fabric lining with a stitched seam along every tile edge
const liningTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#7b806b'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(${rnd() < 0.5 ? '255,255,240' : '30,30,20'},${rr(0.02, 0.06)})`; x.fillRect(rnd() * w, rnd() * h, rr(1, 3), 1); }
  x.strokeStyle = 'rgba(40,36,28,0.35)'; x.lineWidth = 2; x.strokeRect(1, 1, w - 2, h - 2);
  x.strokeStyle = 'rgba(226,210,170,0.7)'; x.lineWidth = 2; x.setLineDash([7, 6]); x.strokeRect(8, 8, w - 16, h - 16);
});
liningTex.wrapS = liningTex.wrapT = T.RepeatWrapping;
const pocketTex = canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#8f8a6e'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) { x.fillStyle = `rgba(20,20,10,${rr(0.02, 0.07)})`; x.fillRect(rnd() * w, rnd() * h, rr(1, 3), 1); }
  x.strokeStyle = 'rgba(236,222,186,0.8)'; x.lineWidth = 2; x.setLineDash([6, 5]); x.strokeRect(7, 7, w - 14, h - 14);
});
// the bag's bottom: stitched leather panels

  room.add(e.empty); hit.userData.target = e; EX[i] = e; return e;
}
