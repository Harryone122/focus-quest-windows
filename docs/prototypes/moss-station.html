  .sky b { color: var(--ink); font-weight: 600; }
  .sky.rain b { color: var(--teal); }

  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

<div id="stage"><canvas id="scene" aria-label="苔痕驛站的 3D 場景：霧海上方的山間小站，旅人會自己在月台、溪邊與林間閒晃，隨專注時間點亮五盞燈，下雨時會找地方躲雨"></canvas></div>

<div class="title">
  <span class="eyebrow">AREA 02 · FOCUS 50:00</span>
  <h1>苔痕驛站</h1>
  <p>一座早就沒有火車停靠的山間小站，卻總有人替下一位旅人留好東西。旅人會自己閒晃；每過十分鐘有效專注，他會去點一盞燈。日夜與天氣是兩條各自走的時間線：每三分鐘有 15% 的機會下五分鐘的雨，雨停後十五分鐘內不會再下。</p>
  <p class="hint">拖曳畫面可以偷看其他角度，放開後會回到固定角度。</p>
</div>

<div class="bar">
  <div class="journal" id="journal" hidden>
    <h2>旅途筆記</h2>
    <ol id="journalList"><li class="empty">還沒有記下任何東西。</li></ol>
  </div>
  <div class="row">
    <div class="status" id="status" aria-live="polite">按下開始，旅人會從霧裡的木棧道走上來。</div>
    <div class="sky" id="sky"><b>晴</b> · 晨霧</div>
    <div class="lamps" id="lamps" aria-label="已點亮的燈">
      <span></span><span></span><span></span><span></span><span></span><small id="lampCount">0 / 5</small>
    </div>
  </div>
  <div class="row">
    <button id="play" type="button">開始專注</button>
    <div class="seg" role="group" aria-label="示範速度">
      <button type="button" data-speed="6" aria-pressed="true">×6</button>
      <button type="button" data-speed="20" aria-pressed="false">×20</button>
      <button type="button" data-speed="60" aria-pressed="false">×60</button>
    </div>
    <button id="skip" type="button" class="quiet">直接看完成後</button>
    <button id="reset" type="button" class="quiet">重來</button>
    <div class="clock" id="clock"><b id="clockNow">00:00</b> / 50:00</div>
  </div>
  <div class="row">
    <div class="seg times" role="group" aria-label="時段">
      <button type="button" data-time="auto" aria-pressed="true">依時間</button>
      <button type="button" data-time="dawn" aria-pressed="false">晨霧</button>
      <button type="button" data-time="day" aria-pressed="false">白天</button>
      <button type="button" data-time="dusk" aria-pressed="false">薄暮</button>
      <button type="button" data-time="night" aria-pressed="false">夜</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button id="rainBtn" type="button" class="quiet">試看下雨</button>
    <button id="rareBtn" type="button" class="quiet">試看特殊發現</button>
    <button id="storyBtn" type="button" class="quiet">試看新事件</button>
    <button id="departA" type="button" class="quiet">試看離開：霧瀑小舟</button>
    <button id="departB" type="button" class="quiet">試看離開：苔痕隧道</button>
    <button id="journalBtn" type="button" class="quiet" aria-expanded="false" aria-controls="journal">旅途筆記 0</button>
  </div>
</div>

 "storyRules": {
  "decided": "2026-09-29 使用者定案（企畫書 §49.8）",
  "opening": "整個遊戲第一次探索選了苔痕驛站時，出生後固定播 story_open_carving（0:15 開始，0:55 前結束；天氣第一次擲骰在 180 秒，所以一定是晴天）。紀錄 m02_open 由第一次專注的回顧發放，不等動畫播完，未滿門檻或動畫中斷也照發。 播放期間比照雲上遺庭的開場（AREA_01_STORY_EVENTS.md）：隱藏所有 Focus 功能鍵與玻璃（reportCinematic(true)），演出結束再淡回，不能拖鏡頭。",
  "visits": "首訪／第二次造訪用『有沒有拿過線索』判定，不用造訪次數：還沒拿到 h1b 的那次探索排 story_first_lantern；已經有 h1b、還沒有 h1c 的下一次探索排 story_second_sketch。舊存檔因此也拿得到。",
  "schedule": "故事事件比照特殊發現：探索開始時就排進某兩盞燈之間（建議第 1–4 盞之間），不和同一次探索的信物／核心排在同一段，並預留走回燈的時間。雨天版本在旅人出發去做的那一刻依天氣決定（同 rare_tablet_rubbing），出發後不改。下雨不會取消已出發的故事事件。",
  "coreGated": "擁有某件核心才發生的事件，核心是永久紀錄，所以可以給線索。每件只發生一次（拿到線索後不再排）。",
  "itemCarry": "帶著特定旅程信物才發生的事件（2026-09-29 使用者決定：與雲上遺庭一致，第一次發生時留下永久線索）：畫面＋這一趟大廳的『新發現』卡片，第一次發生時另外寫一條永久線索（種類都是筆記，不指向地點）；之後再發生只有畫面與卡片。線索是『查到的紀錄』，收藏室裡的『看懂了一些』依然只讀永久紀錄，不讀此刻有沒有帶信物。因為信物每趟隨機，這類線索不能是隱藏地圖解鎖的唯一來源（沉燈灣的方位與樣子線索都來自不需要信物的事件）。每次探索最多一件，偽隨機、就近優先；苔痕自己的信物要在同一次探索取得之後才算『帶著』。",
  "clues": "線索永久保存，由後端在事件結算時寫入；收藏室托盤顯示『新的線索』。還沒去過的地圖名稱依 mentions 顯示為「？？？」。"
