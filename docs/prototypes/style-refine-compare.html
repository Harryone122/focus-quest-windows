<title>精緻 low poly 對照</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap">
<style>
/* Layout: the scene fills the window; one frosted-glass bar floats at the top (same glass language as the app), a short note sits bottom-left. Single dark look on purpose: it sits over a 3D scene. */
:root {
  --ink: #f1eee6; --ink-dim: rgba(241,238,230,.68); --amber: #e0b265; --teal: #a9d0c9;
  --glass: rgba(28,30,36,.42); --glass-line: rgba(241,238,230,.16); --ground: #8fb2d8;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--sans); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.bar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; max-width: calc(100vw - 32px);
  padding: 10px 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); box-shadow: 0 8px 30px rgba(10,12,18,.25); }
.seg { display: flex; padding: 3px; gap: 2px; border-radius: 13px; background: rgba(10,12,18,.28); }
button { font: 500 13px/1 var(--sans); color: var(--ink-dim); background: transparent; border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; letter-spacing: .02em; }
button:hover { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
button[aria-pressed="true"] { color: #2a2218; background: var(--amber); }
.seg.big button { font: 600 15px/1 var(--serif); padding: 9px 16px; }
.chip[aria-pressed="true"] { color: var(--ink); background: rgba(169,208,201,.22); box-shadow: inset 0 0 0 1px rgba(169,208,201,.55); }
.lab { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; }
.grp { display: flex; align-items: center; gap: 6px; }
#badge { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(18px + env(safe-area-inset-top, 0px)); z-index: 4; font: 600 26px/1.1 var(--serif); color: var(--ink); text-shadow: 0 2px 12px rgba(0,0,0,.35); }
.note { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 4; max-width: min(420px, calc(100vw - 32px));
  padding: 12px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  font-size: 12.5px; line-height: 1.65; color: var(--ink-dim); }
.note b { color: var(--ink); font-weight: 600; }
.note kbd { font: 11px var(--sans); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--glass-line); color: var(--ink); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 16px var(--serif); color: var(--ink); z-index: 3; }
body.ready .loading { display: none; }
@media (max-width: 720px) { #badge { display: none; } .note { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="stage"></div>
<div class="loading">藏聲秋谷載入中…</div>
<div id="badge">精緻版</div>
<div class="bar" role="toolbar" aria-label="對照">
  <div class="seg big"><button id="modeCur" type="button">現在</button><button id="modeRef" type="button">精緻版</button></div>
  <div class="grp"><span class="lab">分項</span><button class="chip" type="button" data-k="trav">旅人</button><button class="chip" type="button" data-k="world">光影材質</button></div>
  <div class="seg"><button type="button" data-k="view" data-v="wide">全景</button><button type="button" data-k="view" data-v="close">旅人特寫</button></div>
  <div class="seg"><button type="button" data-k="time" data-v="dawn">晨</button><button type="button" data-k="time" data-v="day">日</button><button type="button" data-k="time" data-v="dusk">暮</button><button type="button" data-k="time" data-v="night">夜</button></div>
</div>
<div class="note"><b>同一個畫面，只換美術處理。</b>按 <kbd>空白鍵</kbd> 在「現在」和「精緻版」之間切換；「分項」可以只開旅人或只開光影材質，看各自的效果。拖曳畫面可以偷看角度，放開會彈回。</div>
