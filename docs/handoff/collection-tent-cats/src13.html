<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳篷小屋三花貓</title>
<style>
  :root{ color-scheme: dark;
    --bg:#0b0807; --glass:rgba(28,20,16,.48); --glass-b:rgba(255,226,190,.16);
    --ink:#f6ead9; --ink-dim:rgba(246,234,217,.62); --accent:#ffb36b;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0807; } }
  :root[data-theme="dark"]{ --bg:#0b0807; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .panel{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);box-sizing:border-box;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:16px;
    background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);font-size:13px}
  .grp{display:flex;gap:4px;align-items:center}
  .lab{color:var(--ink-dim);margin:0 4px 0 6px;font-size:12px}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:6px 10px;cursor:pointer;transition:background .2s,border-color .2s}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:hover{background:rgba(255,255,255,.12)}
  button.on{background:rgba(255,179,107,.22);border-color:rgba(255,179,107,.55)}
  .hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:calc(110px + env(safe-area-inset-right,0px));font-size:12px;color:var(--ink-dim);pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .hint b{color:var(--ink);font-weight:600}
  .fps{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--ink-dim);background:var(--bg);transition:opacity .6s}
</style>
</head>
<body>
<div id="load">正在把貓抱進帳篷…</div>
<div class="hint"><b>帳篷收藏室 · 三花貓第十三版</b>　拖曳旋轉、滾輪縮放；點貓咪，牠會慢慢眨眼看你；按「打哈欠」看牠張嘴。</div>
<div class="fps" id="fps"></div>
<div class="panel">
  <div class="grp"><span class="lab">鏡頭</span>
    <button data-cam="wide" class="on">全景</button><button data-cam="mid">貓</button><button data-cam="face">臉部特寫</button><button data-cam="side">側臉</button></div>
  <div class="grp"><span class="lab">動作</span>
    <button id="yawnBtn">打哈欠</button><button id="blinkBtn">眨眼</button></div>
  <div class="grp"><span class="lab">毛髮</span>
    <button id="furBtn" class="on">開</button></div>
  <div class="grp"><span class="lab">毛層</span>
    <button data-q="16">16</button><button data-q="32" class="on">32</button><button data-q="56">56</button></div>
</div>
<script id="catdata" type="application/json">/*CATDATA*/</script>

add(room, box(0.06, 0.2, 0.15, '#3d4a63', FX - 0.6, 1.39, FZ + 0.1, 0.004));

const furVS = /* glsl */`
precision highp float;
attribute vec3 comb; attribute vec4 attrA; attribute vec4 attrB; attribute float stripe;
attribute vec4 defA; attribute float defE; attribute float aShell; attribute vec4 aFace; attribute float aTng; attribute float aLip; attribute vec3 aRest;
uniform float uFurScale, uBreath, uFurOn;
uniform vec4 uHeadQ, uEarQL, uEarQR, uTailQ;
uniform vec3 uNeck, uEarPL, uEarPR, uTailP;
uniform float uJaw, uTongue; uniform vec3 uHinge, uTongueP; uniform vec2 uBlink; uniform vec3 uEyeC0, uEyeC1, uEyeA0, uEyeA1;
varying vec3 vWorld, vN, vT, vRest, vRN, vRC;
varying float vH, vLen, vStripe;
varying vec4 vA, vB, vF;
varying float vTg;
vec3 qrot(vec4 q, vec3 v){ return v + 2.0*cross(q.xyz, cross(q.xyz, v) + q.w*v); }
vec4 qpart(vec4 q, float w){ return normalize(mix(vec4(0.,0.,0.,1.), q, w)); }
void xf(vec4 q, vec3 piv, float w, inout vec3 p, inout vec3 n, inout vec3 t){
  if (w < 0.001) return; vec4 r = qpart(q, w); p = piv + qrot(r, p - piv); n = qrot(r, n); t = qrot(r, t);
}
void axrot(vec3 ax, float a, vec3 piv, inout vec3 p, inout vec3 n, inout vec3 t){
  vec4 r = vec4(ax * sin(0.5 * a), cos(0.5 * a)); p = piv + qrot(r, p - piv); n = qrot(r, n); t = qrot(r, t);
}
void main(){
  float h = aShell * uFurOn;
  float L = attrA.x * uFurScale * (1.0 - aLip * smoothstep(0.04, 0.35, uJaw));   // lip fur parts only while the mouth opens
  vec3 n = normal; vec3 c = comb; vec3 g = vec3(0.,-1.,0.);
  vec3 p = position + n * (uBreath * defA.y * 0.0026);
  p += n * L * h * 0.8 + c * L * (0.35 * h + 0.6 * h * h) + g * L * 0.14 * h * h;
  vec3 t = normalize(n * 0.8 + c * (0.35 + 1.2 * h) + g * 0.28 * h);
  // v10 face rig (rest pose): tongue curl, jaw, eyelids — all before the head turns
  if (aTng > 0.0) { axrot(vec3(0., 0., 1.), uTongue * aTng * aTng * 1.1, uTongueP, p, n, t); p.x += uTongue * aTng * 0.0045; }
  if (aFace.x > 0.001) axrot(vec3(0., 0., 1.), -uJaw * aFace.x, uHinge, p, n, t);
  if (abs(aFace.y) > 0.0001) {
    bool e1 = aFace.z > 0.5; vec3 C = e1 ? uEyeC1 : uEyeC0; vec3 A = e1 ? uEyeA1 : uEyeA0; float b = e1 ? uBlink.y : uBlink.x;
    axrot(A, aFace.y * b, C, p, n, t);
    if (aFace.y < 0.0) p += normalize(p - C) * 0.00035 * b;   // upper lid rides over the lower one
  }
  xf(uEarQL, uEarPL, defA.w, p, n, t);
  xf(uEarQR, uEarPR, defE, p, n, t);
  xf(uHeadQ, uNeck, defA.x, p, n, t);
  xf(uTailQ, uTailP, defA.z, p, n, t);
  vec4 wp = modelMatrix * vec4(p, 1.0);
  vWorld = wp.xyz; vN = normalize(mat3(modelMatrix) * n); vT = normalize(mat3(modelMatrix) * t);
  vRest = aRest; vRN = normal; vRC = comb; vH = h; vLen = L; vA = attrA; vB = attrB; vStripe = stripe; vF = aFace; vTg = aTng;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const furFS = /* glsl */`

float h13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
