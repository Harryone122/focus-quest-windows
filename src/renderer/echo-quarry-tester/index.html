<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area 05 · 場景試玩</title></head><body><main id="scene"></main><header><small>AREA 05 · 獨立試玩</small><h1>藏聲秋谷</h1><p>拖曳看不同角度，放開會回到原鏡頭。</p></header><aside><div class="top"><strong id="clock">00:00 / 50:00</strong><span id="lamps">○ ○ ○ ○ ○</span><span id="phase"></span></div><p id="activity" aria-live="polite"></p><div class="row"><button id="play">暫停</button><label>探索速度 <select id="speed"><option value="1">正常</option><option value="6" selected>6 倍</option><option value="20">20 倍</option><option value="60">60 倍</option></select></label><label>光線 <select id="time"><option value="auto">依探索時間</option><option value="dawn">晨霧</option><option value="day">白天</option><option value="dusk">薄暮</option><option value="night">夜晚</option></select></label><button id="new">重新探索</button><button id="complete">走去休息</button></div><div class="row"><label>環境音 <input id="env-volume" type="range" min="0" max="100" value="35"></label><label>背景音 <input id="music-volume" type="range" min="0" max="100" value="25"></label><label><input id="audio-muted" type="checkbox"> 靜音</label></div><details><summary>逐段試看</summary><p class="hint">下列事件會開始一趟獨立演出。可隨時暫停；不會寫入遊戲存檔。</p><div class="row"><button data-event="second">岩壁裡的聲音</button><button data-event="core">取得藏聲石</button><button data-event="whistle">銅製風哨</button><button id="echo">聽回音的探索</button><button id="wind">山風石歌</button><button data-discovery="fork">調音叉音效</button><button data-discovery="mica">剝雲母音效</button></div><div class="row"><label>前往地點 <select id="spot"></select></label><button id="go">走過去</button></div></details><small class="hint">聽回音沿用完整時間預算與每趟一次限制。音效已接入；未提供正式出口與收藏室。</small></aside><script type="module" src="./main.js"></script></body></html>
