<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Focus Quest app icon: the lantern traveller on a floating island at dusk -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2638"/>
      <stop offset="0.52" stop-color="#46506a"/>
      <stop offset="1" stop-color="#b78f78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf86" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffb45e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1eee6" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#f1eee6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f1eee6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sky)"/>
    <!-- soft moon halo behind the hat -->
    <circle cx="238" cy="196" r="150" fill="url(#moon)"/>
    

    <g transform="translate(252 318) scale(1.5) translate(-256 -300)">
    <!-- distant small island, top right -->
    <g class="extra" display="none">
    <g opacity=".55">
      <path d="M362 132 L392 124 L424 130 L416 140 L392 144 L370 140 Z" fill="#6e7f66"/>
      <path d="M370 140 L392 144 L416 140 L398 162 L392 172 L384 160 Z" fill="#5a5058"/>
      <path d="M404 128 L412 104 L420 128 Z" fill="#506c5d"/>
    </g>
    </g>

    <!-- clouds behind the island -->
    <g fill="#e9dccd" opacity=".55">
      <circle cx="420" cy="430" r="30"/><circle cx="456" cy="420" r="36"/><circle cx="486" cy="440" r="30"/>
    </g>

    <!-- floating island: underside -->
    <path d="M112 394 L190 406 L300 408 L402 394 L364 430 L300 452 L262 484 L232 452 L168 428 Z" fill="#6b5a4b"/>
    <path d="M300 408 L402 394 L364 430 L300 452 Z" fill="#584a40"/>
    <path d="M232 452 L262 484 L300 452 L262 440 Z" fill="#4b4a50"/>
    <path d="M112 394 L168 428 L232 452 L190 406 Z" fill="#7b6753"/>
    <!-- floating island: grass top -->
    <path d="M100 380 L150 358 L252 348 L352 352 L414 372 L402 394 L300 408 L190 406 L112 394 Z" fill="#7d9169"/>
    <path d="M100 380 L150 358 L252 348 L352 352 L414 372 L300 380 L190 382 Z" fill="#8ea37a"/>
    <path d="M300 380 L414 372 L402 394 L300 408 Z" fill="#6c8660"/>

    <!-- stepping stones leading on -->
    <g fill="#c4beb0">
      <ellipse cx="338" cy="378" rx="13" ry="5"/>
      <ellipse cx="372" cy="372" rx="11" ry="4.5"/>
      <ellipse cx="146" cy="382" rx="12" ry="4.5" opacity=".8"/>
    </g>
    <!-- small pine at the back of the island -->
    <path d="M128 372 L144 300 L160 372 Z" fill="#506c5d"/>
    <path d="M144 300 L160 372 L146 372 Z" fill="#5c7a69"/>

    <!-- lantern glow (drawn under the traveller so it wraps him) -->
    <circle cx="334" cy="210" r="112" fill="url(#glow)"/>

    <!-- ground shadow -->
    <ellipse cx="244" cy="374" rx="58" ry="8" fill="#2a2926" opacity=".35"/>

    <!-- legs (mid-stride) -->
    <path d="M226 322 L214 372" stroke="#453930" stroke-width="15" stroke-linecap="round"/>
    <path d="M254 322 L270 370" stroke="#54463a" stroke-width="15" stroke-linecap="round"/>

    <!-- bedroll on the back -->
    <ellipse cx="206" cy="250" rx="23" ry="19" fill="#8a6f55"/>
    <ellipse cx="206" cy="250" rx="11" ry="9" fill="#6f5b49"/>

    <!-- cloak -->
    <path d="M226 218 L258 218 L300 330 L240 336 L172 328 Z" fill="#3d4659"/>
    <path d="M242 218 L258 218 L300 330 L244 336 Z" fill="#525d78"/>
    <path d="M172 328 L240 336 L300 330 L296 320 L240 326 L178 318 Z" fill="#323a4b"/>

    <!-- staff -->
    <path d="M300 170 L324 378" stroke="#6f5b49" stroke-width="8" stroke-linecap="round"/>
    <path d="M301 174 L338 168" stroke="#54463a" stroke-width="7" stroke-linecap="round"/>
    <!-- lantern -->
    <path d="M338 168 L338 184" stroke="#54463a" stroke-width="3"/>
    <path d="M326 186 L350 186 L346 180 L330 180 Z" fill="#54463a"/>
    <rect x="325" y="186" width="26" height="34" rx="5" fill="#ffd28a" stroke="#54463a" stroke-width="4"/>
    <rect x="332" y="192" width="12" height="22" rx="3" fill="#fff1d2"/>
    <path d="M328 222 L348 222" stroke="#54463a" stroke-width="4" stroke-linecap="round"/>

    <!-- arm to the staff -->
    <path d="M254 236 L306 272" stroke="#46516a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="309" cy="274" r="9" fill="#e0d2c0"/>

    <!-- head -->
    <circle cx="246" cy="206" r="19" fill="#e0d2c0"/>
    <!-- wide straw hat -->
    <path d="M160 210 Q244 226 330 206 L246 146 Z" fill="#b49c70"/>
    <path d="M246 146 L330 206 Q290 216 250 218 Z" fill="#cfb684"/>
    <path d="M160 210 Q244 226 330 206" fill="none" stroke="#8c774f" stroke-width="5" stroke-linecap="round"/>
    <path d="M226 190 Q246 196 270 188" fill="none" stroke="#8c774f" stroke-width="4" opacity=".7"/>

    <!-- low clouds in front of the island underside -->
    <g fill="#f1eee6" opacity=".9">
      <circle cx="80" cy="458" r="30"/><circle cx="118" cy="470" r="34"/><circle cx="46" cy="478" r="30"/><circle cx="160" cy="492" r="26"/>
    </g>
    </g>
  </g>
</svg>
